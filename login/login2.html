<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <div class="login-card">
        <h2>Bienvenido</h2>
        
        <form>
            
            <div class="input-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" required>
            </div>
            
            <div class="input-group">
                <label for="contraseña">Contraseña</label>
                <input type="password" id="contraseña" name="contraseña" placeholder="Mínimo 8 digitos" required minlength="8">
            </div>
            
            <a href="#" style=" color: #000000; text-decoration: none; font-size: 14px;">¿Olvidaste tu contraseña?</a>
            
            <div style="text-align: right; margin-top: 15px;"">
                <button type="submit" style=" background-color: #202444; color: white; border: none; padding: 10px 20px; border-radius: 15px; cursor: pointer">Login</button>
            </div>

        </form>
    </div>
    
</body>
</html>
